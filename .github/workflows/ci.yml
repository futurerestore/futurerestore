Linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Linux Build
        id: Linux
        run: |
          REPO_NAME="$(basename "${{ github.workspace }}")"

          echo "Workspace: ${{ github.workspace }}"
          echo "Repository: ${REPO_NAME}"

          docker run --rm \
            -v "${{ github.workspace }}/..:/tmp/Builder/repos" \
            debian:buster-slim \
            bash -c "
              set -e

              REPO=/tmp/Builder/repos/${REPO_NAME}

              echo 'Repository inside container:'
              ls -la \"\$REPO\"

              echo 'Running linux-bootstrap.sh'
              \"\$REPO/.github/workflows/linux-bootstrap.sh\"

              echo 'Running linux-build.sh'
              \"\$REPO/.github/workflows/linux-build.sh\"

              echo 'Running linux-post.sh'
              \"\$REPO/.github/workflows/linux-post.sh\"

              mkdir -p \"\$REPO/.github/workflows\"
            "

      - name: Show Linux Build Output
        run: |
          echo "Files produced:"
          find "${{ github.workspace }}/.github/workflows" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' | sort

      - name: Linux x86_64 RELEASE Build
        id: Linux-x86_64-RELEASE-Build
        run: |
          sudo chown -R "$USER:$USER" "${{ github.workspace }}/../"

          mv \
            "${{ github.workspace }}/.github/workflows/futurerestore1.tar.xz" \
            "${{ github.workspace }}/.github/workflows/$(cat "${{ github.workspace }}/.github/workflows/name1.txt")"

      - name: Linux x86_64 DEBUG Build
        id: Linux-x86_64-DEBUG-Build
        run: |
          mv \
            "${{ github.workspace }}/.github/workflows/futurerestore2.tar.xz" \
            "${{ github.workspace }}/.github/workflows/$(cat "${{ github.workspace }}/.github/workflows/name2.txt")"

      - name: Linux x86_64 ASAN Build
        id: Linux-x86_64-ASAN-Build
        run: |
          mv \
            "${{ github.workspace }}/.github/workflows/futurerestore3.tar.xz" \
            "${{ github.workspace }}/.github/workflows/$(cat "${{ github.workspace }}/.github/workflows/name3.txt")"

      - name: futurerestore Linux x86_64 RELEASE Archive
        id: futurerestore-Linux-x86_64-RELEASE-Archive
        uses: actions/upload-artifact@v4
        with:
          name: futurerestore-Linux-x86_64-RELEASE
          path: |
            ${{ github.workspace }}/.github/workflows/futurerestore-Linux-x86_64*-RELEASE.tar.xz

      - name: futurerestore Linux x86_64 DEBUG Archive
        id: futurerestore-Linux-x86_64-DEBUG-Archive
        uses: actions/upload-artifact@v4
        with:
          name: futurerestore-Linux-x86_64-DEBUG
          path: |
            ${{ github.workspace }}/.github/workflows/futurerestore-Linux-x86_64*-DEBUG.tar.xz

      - name: futurerestore Linux x86_64 ASAN Archive
        id: futurerestore-Linux-x86_64-ASAN-Archive
        uses: actions/upload-artifact@v4
        with:
          name: futurerestore-Linux-x86_64-ASAN
          path: |
            ${{ github.workspace }}/.github/workflows/futurerestore-Linux-x86_64*-ASAN.tar.xz
